[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-qrcode-generator"
version = "1.0.0"
description = "A Persian-friendly Python utility for generating Wi-Fi QR codes"
requires-python = ">=3.9"
dependencies = ["qrcode[pil]>=8.0,<9.0"]

[project.scripts]
wifi-qrcode = "src.wifi_qrcode:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
